 function apply(theme){theme=theme==='light'?'light':'dark';root.setAttribute('data-theme',theme);if(button){button.setAttribute('aria-pressed',String(theme==='light'));button.setAttribute('aria-label',theme==='dark'?'Passer en mode clair':'Passer en mode sombre');}if(label){label.textContent=theme==='dark'?'Mode clair':'Mode sombre';}var icon=button&&button.querySelector('[aria-hidden="true"]');if(icon)icon.textContent=theme==='dark'?'☀️':'🌙';}
 var saved=null;try{saved=localStorage.getItem(key)}catch(e){}apply(saved==='light'?'light':'dark');
 if(button)button.addEventListener('click',function(){var next=root.getAttribute('data-theme')==='dark'?'light':'dark';apply(next);try{localStorage.setItem(key,next)}catch(e){}});
})();
</script>

an-rear"><i></i><span></span><i></i></div><b>Arrière</b><small>Portes, feux, pare-chocs</small></div></div>`:''}<div class="checkup-progress"><span id="cuProgressText">0 élément vérifié</span><div><i id="cuProgressBar"></i></div></div><div class="checkup-list">${fields}</div></section><section class="checkup-section"><h2>3. Observations et signature</h2><label class="full-label">Observations générales<textarea id="cuNotes" rows="3" placeholder="Anomalies, pièces à commander, actions réalisées…"></textarea></label><label class="full-label">Signature du technicien</label><canvas id="cuSignature"></canvas><button class="secondary-btn" id="clearSig" type="button">Effacer la signature</button></section><div class="checkup-actions"><button class="big-open" type="submit">💾 Enregistrer le contrôle</button><button class="secondary-btn" id="printCu" type="button">🖨️ Imprimer / PDF</button><button class="secondary-btn" id="newCu" type="button">Nouveau contrôle</button></div></form><section class="checkup-section"><h2>Historique de ce check-up</h2><div id="cuHistory"></div></section></section>`;
 app.querySelector('.back-btn').onclick=()=>showPage('home');const date=app.querySelector('#cuDate');date.value=new Date().toISOString().slice(0,10);const canvas=app.querySelector('#cuSignature'),ctx=canvas.getContext('2d');let drawing=false,ink=false;
 function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(300,Math.floor(r.width*devicePixelRatio));canvas.height=150*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#10243b'}resize();
 function pt(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{drawing=true;ink=true;canvas.setPointerCapture(e.pointerId);const p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};canvas.onpointermove=e=>{if(drawing){const p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke()}};['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));app.querySelector('#clearSig').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ink=false};

<script>
/* Sur téléphone, la barre de navigation apparaît au toucher puis se replie après quelques secondes. */
(function(){
  var mq = window.matchMedia('(max-width: 700px)');
  var timer = null;
  function reveal(){
    if (!mq.matches) { document.body.classList.remove('nav-visible'); return; }
    document.body.classList.add('nav-visible');
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(function(){
      document.body.classList.remove('nav-visible');
    }, 4500);
  }
  document.addEventListener('touchstart', reveal, {passive:true});
  document.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'touch' || e.pointerType === 'pen') reveal();
  }, {passive:true});
  document.addEventListener('focusin', function(e){
    if (mq.matches && e.target.closest && e.target.closest('.bottom-nav')) reveal();
  });
  window.addEventListener('resize', function(){
    if (!mq.matches) {
      if (timer) window.clearTimeout(timer);
      document.body.classList.remove('nav-visible');
    }
  });
})();
</script>

 let index=0;
 const modal=document.createElement('div');modal.className='demo-modal';modal.id='demoModal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Mode démonstration EuroMed');modal.hidden=true;
 modal.innerHTML='<div class="demo-panel"><div class="demo-modal-top"><span class="demo-badge">▶ MODE DÉMONSTRATION</span><button class="demo-close" type="button" aria-label="Fermer la démonstration">✕</button></div><div class="demo-progress"><i></i></div><div class="demo-content"></div><div class="demo-footer"><button class="demo-prev" type="button">← Précédent</button><span class="demo-counter"></span><button class="demo-next" type="button">Suivant →</button></div><p class="demo-safety">Présentation guidée · Les liens ouvrent les applications réelles. Ne validez pas de document et n’envoyez pas de données pendant la présentation.</p></div>';
 document.body.appendChild(modal);
 const content=modal.querySelector('.demo-content');
 function render(){
  const s=slides[index];
  const shortTitle=s.eyebrow.replace(/^\d+\s*[·.-]\s*/,'');
  const dots=slides.map((item,i)=>'<button type="button" class="demo-step-dot'+(i===index?' is-active':'')+(i<index?' is-done':'')+'" data-demo-step="'+i+'" aria-label="Étape '+(i+1)+' : '+item.title.replace(/"/g,'&quot;')+'" title="'+item.title.replace(/"/g,'&quot;')+'"><span>'+(i<index?'✓':i+1)+'</span></button>').join('');
  content.innerHTML=
   '<div class="demo-slide-heading"><div class="demo-heading-copy"><span class="demo-eyebrow">'+shortTitle+'</span><h2>'+s.title+'</h2></div></div>'+
   '<p class="demo-intro">'+s.text+'</p>'+
   '<div class="demo-highlights"><span>📱 Adapté au mobile</span><span>🧭 Parcours guidé</span><span>🛠️ Outils EuroMed</span></div>'+
   '<div class="demo-items">'+s.items.map((x,i)=>'<article class="demo-item" style="--demo-card-index:'+i+'"><span class="demo-item-icon">'+x[0]+'</span><div><b>'+x[1]+'</b><p>'+x[2]+'</p></div></article>').join('')+'</div>'+
   (s.links?'<div class="demo-actions"><div class="demo-actions-title"><span>À VOIR EN DIRECT</span><small>Ouvrir une application dans un nouvel onglet</small></div><div class="demo-links">'+s.links.map(x=>'<button type="button" class="demo-link" data-demo-link="'+x[1]+'"><span>'+x[0]+'</span><b aria-hidden="true">↗</b></button>').join('')+'</div></div>':'')+
   '<div class="demo-step-track" aria-label="Progression de la présentation">'+dots+'</div>';
  modal.querySelector('.demo-counter').textContent='ÉTAPE '+String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  modal.querySelector('.demo-progress i').style.width=((index+1)/slides.length*100)+'%';
  modal.querySelector('.demo-prev').disabled=index===0;
  modal.querySelector('.demo-next').textContent=index===slides.length-1?'Terminer la présentation ✓':'Étape suivante →';
  const panel=modal.querySelector('.demo-panel');
  panel.scrollTop=0;
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>{panel.scrollTop=0;});
 }
 function open(){index=0;render();modal.hidden=false;document.body.classList.add('demo-open');modal.querySelector('.demo-next').focus();}
 function close(){modal.hidden=true;document.body.classList.remove('demo-open');}
 document.addEventListener('click',e=>{if(e.target.closest('#openDemoMode'))open();});
 modal.querySelector('.demo-close').addEventListener('click',close);
 modal.addEventListener('click',e=>{if(e.target===modal)close();});
 modal.querySelector('.demo-prev').addEventListener('click',()=>{if(index>0){index--;render();}});
 modal.querySelector('.demo-next').addEventListener('click',()=>{if(index<slides.length-1){index++;render();}else close();});
 modal.addEventListener('click',e=>{
  const step=e.target.closest('[data-demo-step]');
  if(step){const n=Number(step.dataset.demoStep);if(Number.isInteger(n)&&n>=0&&n<slides.length){index=n;render();}return;}
  const b=e.target.closest('[data-demo-link]');if(!b)return;
  const dest=b.dataset.demoLink;
  if(dest==='internal:maintenance'){close();showPage('maintenance');}
  else if(dest==='internal:checkupTruck'){close();showPage('checkupTruck');}
  else if(dest==='internal:checkupParts'){close();showPage('checkupParts');}
  else {close();window.open(dest,'_blank','noopener');}
 });
 document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')modal.querySelector('.demo-next').click();if(e.key==='ArrowLeft')modal.querySelector('.demo-prev').click();});
})();
</script>
