<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EuroMed">
<title>EuroMed — Hub Technicien</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <main id="app" class="app-content"></main>
  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav-item active" data-page="home" type="button"><span class="nav-icon">⌂</span><span>Accueil</span></button>
    <button class="nav-item" data-page="maintenance" type="button"><span class="nav-icon">✚</span><span>Maintenance</span></button>
    <a class="nav-item" href="https://hawaryou.github.io/envoi_pdf_euromed/"><span class="nav-icon">▤</span><span>Documentation</span></a>
  </nav>
</div>
<script>
const MAINTENANCE = [
  {id:'lit', title:'Lit médicalisé', short:'Lit', subtitle:'Contrôle et certificat de maintenance', url:'https://hawaryou.github.io/maintenance-lit-medical/', cls:'blue', icon:'🛏️'},
  {id:'fauteuil', title:'Fauteuil roulant', short:'Fauteuil', subtitle:'Maintenance et contrôles', url:'https://hawaryou.github.io/maintenance-fauteuil-roulant/', cls:'pink', icon:'♿'},
  {id:'matelas', title:'Matelas à air', short:'Matelas', subtitle:'Maintenance du système alternating', url:'https://hawaryou.github.io/maintenance-matelas-alternating/', cls:'yellow', icon:'🛌'},
  {id:'leve', title:'Lève-personne', short:'Lève-personne', subtitle:'Maintenance et contrôles', url:'https://hawaryou.github.io/maintenance-leve-personne/', cls:'green', icon:'🏥'},
  {id:'verticalisateur', title:'Verticalisateur', short:'Verticalisateur', subtitle:'Maintenance et contrôles', url:'https://hawaryou.github.io/maintenance-verticalisateur/', cls:'violet', icon:'🧍'}
];
const app=document.getElementById('app');
const navItems=[...document.querySelectorAll('.nav-item')];
function logo(){return `<img class="logo" src="assets/euromed-logo.png" alt="EuroMed">`}
function showPage(page){setNav(page);window.scrollTo({top:0,behavior:'smooth'});page==='maintenance'?maintenancePage():home()}
function setNav(page){navItems.forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function arrow(){return '<span class="arrow">→</span>'}
function home(){
 app.innerHTML=`
 <section class="home-top">
   <div class="topbar"><div class="brand-box">${logo()}</div><div class="profile-dot">E</div></div>
   <div class="hero-card">
     <div class="hero-copy"><span class="mini-label">HUB TECHNICIEN</span><h1>Bonjour,<br><strong>prêt pour l’intervention ?</strong></h1><p>Tous vos outils EuroMed réunis dans une seule application.</p></div>
     <div class="hero-mascot"><div class="mascot-orbit"></div><img src="assets/chibi-euromed.png" alt="Mascotte EuroMed"></div>
   </div>
 </section>
 <section class="content-section">
   <div class="section-head"><div><span class="section-kicker">ACCÈS RAPIDE</span><h2>Vos outils</h2></div></div>
   <div class="quick-grid">
    <a class="quick-card delivery" href="https://hawaryou.github.io/Bon-de-livraison-euromed/"><div class="quick-icon">▤</div><div><b>Carnet de<br>livraison</b><small>Créer un bon</small></div>${arrow()}</a>
    <a class="quick-card inventory" href="https://hawaryou.github.io/inventaire-materiel/"><div class="quick-icon">▦</div><div><b>Inventaire<br>matériel</b><small>Gérer le parc</small></div>${arrow()}</a>
   </div>
 </section>
 <section class="content-section maintenance-home">
   <div class="section-head section-head-row"><div><span class="section-kicker">CONTRÔLE & SUIVI</span><h2>Maintenances</h2><p>Choisissez un équipement</p></div><button class="view-all" data-page="maintenance">Tout voir</button></div>
   <div class="maintenance-scroller">${MAINTENANCE.map((x,i)=>`<a class="maintenance-tile ${x.cls}" href="${x.url}"><div class="tile-icon">${x.icon}</div><span>${x.title}</span><small>Maintenance</small><i>${i+1}</i></a>`).join('')}</div>
 </section>
 <section class="content-section"><div class="info-banner"><div class="info-check">✓</div><div><b>Tout est prêt</b><span>Utilisez la navigation en bas pour accéder rapidement aux maintenances et à la documentation.</span></div></div></section>
 <footer>EUROMED · Votre partenaire en matériel médical</footer>`;
 app.querySelector('.view-all').addEventListener('click',()=>showPage('maintenance'));
}
function maintenancePage(){
 app.innerHTML=`
 <section class="page-top"><div class="topbar"><div class="brand-box">${logo()}</div><div class="profile-dot">E</div></div><span class="section-kicker">ESPACE MAINTENANCE</span><h1>Quel équipement<br><strong>voulez-vous contrôler ?</strong></h1><p>Sélectionnez une catégorie puis ouvrez directement son formulaire.</p></section>
 <section class="content-section maintenance-page-section">
   <div class="tab-scroller" role="tablist">${MAINTENANCE.map((x,i)=>`<button class="maint-tab ${i===0?'active':''}" data-id="${x.id}" role="tab" type="button">${x.short}</button>`).join('')}</div>
   <div id="maintenance-panel"></div>
 </section>
 <section class="content-section"><div class="info-banner compact-info"><div class="info-check">✓</div><div><b>Accès direct</b><span>Le formulaire s’ouvre dans une nouvelle page. Revenez au Hub avec Accueil.</span></div></div></section>`;
 const panel=app.querySelector('#maintenance-panel');
 function select(id){const item=MAINTENANCE.find(x=>x.id===id);app.querySelectorAll('.maint-tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));panel.innerHTML=`<div class="selected-maint ${item.cls}"><div class="selected-art">${item.icon}</div><span class="selected-kicker">MAINTENANCE</span><h2>${item.title}</h2><p>${item.subtitle}</p><a class="big-open" href="${item.url}">Ouvrir la maintenance ${arrow()}</a></div>`}
 app.querySelectorAll('.maint-tab').forEach(t=>t.addEventListener('click',()=>select(t.dataset.id)));select('lit');
}
navItems.forEach(item=>{if(item.dataset.page)item.addEventListener('click',()=>showPage(item.dataset.page))});
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b&&b.classList.contains('view-all'))showPage(b.dataset.page)});
home();
</script>
</body>
</html>
